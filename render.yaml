# render.yaml — Blueprint for 1-Click Render Deployment
services:
  - type: web
    name: terrapulse-ai-nasa
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@terrapulse.local
      - key: ADMIN_PASSWORD
        value: TerraPulse@Admin2024
      - key: ADMIN_USERNAME
        value: admin
